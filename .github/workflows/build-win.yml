name: build-win

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'extensions/su-ai/**'
      - 'branding/**'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/build-win.yml'

# Artifact upload needs read; Pre-release publish needs write (create tag + Release).
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SU_NODE_HEAP_MB: '14336'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prefer setup-node on PATH
        shell: pwsh
        run: |
          $nodeDir = Split-Path -Parent (Get-Command node).Source
          Write-Host "nodeDir=$nodeDir"
          Add-Content -Path $env:GITHUB_PATH -Value $nodeDir

      - name: Bootstrap upstream + branding
        shell: pwsh
        run: .\scripts\bootstrap.ps1

      - name: Build win32-x64 (esbuild fast path)
        shell: pwsh
        run: .\scripts\build-win.ps1

      - name: Package
        shell: pwsh
        run: .\scripts\package-win.ps1

      - name: Resolve Pre-release tag
        id: meta
        shell: pwsh
        run: |
          $ver = '0.0.0'
          $path = 'branding/version.json'
          if (Test-Path $path) {
            $ver = [string](Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json).version
            $ver = $ver.Trim().TrimStart('v', 'V')
          }
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          # Unique per commit/day so develop rebuilds do not clobber each other.
          $tag = "v$ver-dev.$date.$sha"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "pre-release tag=$tag (base version=$ver)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: su-win32-x64
          path: out/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: su ${{ steps.meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            自动构建自 `develop`（commit `${{ github.sha }}`）。

            - 基线版本：`${{ steps.meta.outputs.version }}`（见 `branding/version.json`）
            - 用途：验收 / 内测；正式版请用 workflow **release-win**（打 `v*` tag）
            - 应用内更新：需开启 `su.update.includePrerelease`
          files: |
            out/su-win32-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
