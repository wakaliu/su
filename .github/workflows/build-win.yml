name: build-win

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'extensions/su-ai/**'
      - 'branding/**'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/build-win.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SU_NODE_HEAP_MB: '14336'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prefer setup-node on PATH
        shell: pwsh
        run: |
          $nodeDir = Split-Path -Parent (Get-Command node).Source
          Write-Host "nodeDir=$nodeDir"
          Add-Content -Path $env:GITHUB_PATH -Value $nodeDir

      - name: Bootstrap upstream + branding
        shell: pwsh
        run: .\scripts\bootstrap.ps1

      - name: Build win32-x64 (esbuild fast path)
        shell: pwsh
        run: .\scripts\build-win.ps1

      - name: Package
        shell: pwsh
        run: .\scripts\package-win.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: su-win32-x64
          path: out/**
          if-no-files-found: warn
          retention-days: 14
